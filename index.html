<html lang="en">
<head>

<title>Tavora Studio</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1d2a; --muted: #5b6078; --accent: #6d3df0; --line: #e3e5ef; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1020; --fg: #eceefa; --muted: #a2a7c4; --accent: #a58bff; --line: #272a47; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  ul { padding-left: 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Tavora Studio</h1>
<p class="muted">Small apps and games for Android.</p>
<h2>Apps</h2>
<ul>

</ul>
<h2>Contact</h2>
<p><a href="mailto:tavora.apps@gmail.com">tavora.apps@gmail.com</a></p>

</body>
</html>
